# ---------------------------------------------------------------------------
# MkDocs configuration
#
# The Obsidian vault IS the docs directory: `docs_dir: .` below, made legal by
# the `mkdocs-same-dir` plugin, so there is exactly one copy of every file.
# What gets published is controlled in two places:
#   1. `exclude_docs` below  -> path-based exclusion (Inbox, Templates, config)
#   2. hooks/publishing.py   -> frontmatter-based exclusion (status: draft)
# ---------------------------------------------------------------------------

site_name: Cloud & Distributed Systems Learning
site_description: A working knowledge base for cloud computing and distributed systems.
site_author: David
# Served from a custom domain (see the CNAME file at the repository root).
# site_url drives canonical <link> tags and sitemap.xml, so it must match the
# hostname visitors actually use — not the github.io fallback.
site_url: https://blogs.sentinelnodes.cc/
repo_url: https://github.com/02david20/distributed-systems-learning-resources
repo_name: distributed-systems-learning-resources
edit_uri: edit/main/

# The repository root IS the docs directory: one copy of every Markdown file,
# edited in Obsidian and published by MkDocs. `docs_dir: .` is normally
# rejected by MkDocs; the `same-dir` plugin below removes that restriction.
docs_dir: .

theme:
  name: material
  language: en
  # Template overrides live in a dot-directory so MkDocs never copies them into
  # the built site (`docs_dir` is the repository root). See .overrides/.
  custom_dir: .overrides
  icon:
    repo: fontawesome/brands/github
  # Roboto and Roboto Mono, served from Google Fonts. These are Material's own
  # defaults; naming them keeps the site from silently changing if the theme
  # ever picks a different default.
  font:
    text: Roboto
    code: Roboto Mono
  features:
    # Navigation: tabs across the top, sticky on scroll, with breadcrumbs in
    # the header and a prev/next pager in the footer.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    # Single-page-application navigation: no full page reload between pages,
    # links prefetched on hover, with a progress bar for slow responses.
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    # Table of contents follows the reading position.
    - toc.follow
    # Search: live suggestions, hit highlighting, shareable result links.
    - search.suggest
    - search.highlight
    - search.share
    # Content: copy and select buttons on code blocks, numbered code
    # annotations, linked content tabs, and hover tooltips for abbreviations
    # and footnotes.
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
    - content.action.edit
    - content.action.view
    # The announcement bar in .overrides/main.html can be dismissed.
    - announce.dismiss
  # Three-state palette toggle: system -> light -> dark, matching the switch
  # used on the Material for MkDocs documentation.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference

# Hero styling and the landing-page layout. Path is relative to `docs_dir`.
extra_css:
  - assets/stylesheets/extra.css

plugins:
  # Removes MkDocs' refusal to accept `docs_dir: .`. Must come first.
  - same-dir
  # Builds the nav from the folder structure; titles/order come from .pages
  # files. This means adding a note never requires editing mkdocs.yml.
  - awesome-pages
  - search

hooks:
  - hooks/publishing.py

# Path-based exclusion (gitignore-style syntax, MkDocs >= 1.6).
# Anything listed here is neither rendered nor copied into the built site.
exclude_docs: |
  .obsidian/
  .github/
  .venv/
  venv/
  hooks/
  site/
  00-Inbox/
  99-Templates/
  requirements.txt
  CLAUDE.md
  LICENSE

markdown_extensions:
  # Callouts: !!! note / !!! warning / ??? collapsible
  - admonition
  - pymdownx.details
  # Tabbed content blocks
  - pymdownx.tabbed:
      alternate_style: true
  # Fenced code + Mermaid rendering. The custom fence keeps ```mermaid blocks
  # identical in Obsidian and on the site.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  # Task lists render the "- [ ]" checkboxes used throughout the templates.
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  # Icons and emoji (`:material-cube-outline:`), used by the card grids on the
  # home page. Twemoji + inline SVG so no icon font is fetched at runtime.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Keyboard keys: ++ctrl+alt+del++
  - pymdownx.keys
  # Abbreviations. With the `content.tooltips` theme feature these render as
  # the theme's own tooltips rather than the browser's.
  - abbr
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - meta

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/02david20
  generator: false

# `mkdocs build --strict` turns these into errors, which is what CI runs.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

copyright: Personal learning notes. Content is a work in progress.
