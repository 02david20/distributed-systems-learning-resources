# Build the MkDocs site on every push and pull request; deploy to GitHub Pages
# only from main.
#
# Uses only first-party actions (actions/*), and the current recommended
# GitHub Pages flow: upload an artifact from a build job, then deploy it with
# actions/deploy-pages. No gh-pages branch, no third-party deploy action, and
# no personal access token — authentication uses OIDC via id-token.
#
# One-time manual setup: Settings -> Pages -> Source -> "GitHub Actions".
# See docs/setup/github.md.

name: Deploy documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time. Do not cancel a run in progress: cancelling
# a half-finished deployment can leave the published site inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # mkdocs-material prints a long banner about a possible future MkDocs 2.0.
  # requirements.txt already pins `mkdocs<2.0`, so the break it warns about
  # cannot reach this build. Silence the banner to keep CI logs readable.
  DISABLE_MKDOCS_2_WARNING: 'true'

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so git-based plugins (e.g. revision dates, if added
          # later) have something to read.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with MkDocs (strict)
        # --strict turns warnings into errors: a broken internal link, a bad
        # anchor or a link to an unpublished note fails the build rather than
        # shipping a dead link.
        run: mkdocs build --strict

      - name: Configure Pages
        # Only needed for the deploy path; skipped on pull requests.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site if it does not exist yet, with the build type
          # set to "workflow". Without this, the first run of a new repository
          # fails with "Get Pages site failed ... Not Found" until someone sets
          # Settings -> Pages -> Source -> GitHub Actions by hand.
          # Harmless once the site exists: the action is idempotent.
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests build but never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
